[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devvault-reference-sdk"
version = "0.1.0"
description = "Reference server-side Python integration for the DevVault v1 verification API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["devvault_sdk*"]

[tool.ruff]
target-version = "py311"
line-length = 100
