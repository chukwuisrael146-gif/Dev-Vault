<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | DevVault</title>
  <style nonce="{{ nonce }}">
    body {font: 18px/1.6 system-ui, sans-serif; background:#f4f7fb; color:#16233b; padding:6vh 24px;}
    main {max-width:520px; margin:auto; padding:32px; background:white; border-radius:16px;}
    input,button {display:block; box-sizing:border-box; width:100%; font:inherit; padding:10px; margin:8px 0 20px;}
    button {background:#173f80; color:white; border:0; border-radius:8px; cursor:pointer;}
  </style>
</head>
<body><main>
  <h1>Reset your password</h1>
  <p id="result" role="status" aria-live="polite">Choose a strong new password.</p>
  <label for="password">New password</label><input id="password" type="password" maxlength="1024" autocomplete="new-password">
  <label for="confirmation">Confirm password</label><input id="confirmation" type="password" maxlength="1024" autocomplete="new-password">
  <button id="submit" type="button" disabled>Reset password</button>
  <noscript>Enable JavaScript or use the JSON API to reset your password.</noscript>
</main><script nonce="{{ nonce }}">
(() => {
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  const endpoint = location.pathname;
  history.replaceState(null, '', endpoint);
  const button = document.getElementById('submit'), result = document.getElementById('result');
  if (!token) {result.textContent = 'Open the complete reset link from your email.'; return;}
  button.disabled = false;
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const response = await fetch(endpoint, {method:'POST', credentials:'omit',
        headers:{'Content-Type':'application/json', 'Accept':'application/json'},
        body:JSON.stringify({token, new_password:document.getElementById('password').value,
          password_confirmation:document.getElementById('confirmation').value})});
      const data = await response.json();
      result.textContent = response.ok ? data.message : (data.error?.message || 'Reset failed.');
      if (response.ok) {document.getElementById('password').value = ''; document.getElementById('confirmation').value = '';}
      else {button.disabled = false;}
    } catch {result.textContent = 'Could not reach DevVault. Try again.'; button.disabled = false;}
  });
})();
</script></body></html>
