services:
  postgres:
    profiles: ["database"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devvault
      POSTGRES_USER: devvault
      POSTGRES_PASSWORD: devvault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devvault -d devvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - devvault_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devvault_postgres_data:
  devvault_redis_data:
