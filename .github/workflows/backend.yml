name: Backend checks
on:
  pull_request:
    paths: ["dev-vault-backend/**", ".github/workflows/backend.yml"]
  push:
    paths: ["dev-vault-backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-vault-backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devvault_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://devvault_test:test-only-ci-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DEVVAULT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: dev-vault-backend/requirements/*.txt
      - run: python -m pip install -c requirements/constraints.txt -r requirements/development.txt
      - run: python -m pip check
      - run: python scripts/check_secrets.py
      - run: python -m ruff check .
      - run: python -m ruff format --check apps api config integrations docker
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py spectacular --settings=config.settings.test --validate --fail-on-warn --file /tmp/openapi.yaml
      - run: diff -u docs/openapi.yaml /tmp/openapi.yaml
      - run: python -m pytest --ds=config.settings.postgresql_test_settings --create-db --cov=apps --cov=api --cov=config --cov-report=term -q
      - run: docker build -f docker/Dockerfile -t devvault-backend:ci .
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: python -m pip_audit --local --strict --progress-spinner off
      - run: python -m bandit -r apps api integrations/python/devvault_sdk -x apps/accounts/tests,apps/access/tests,apps/core/tests,apps/credentials/tests,apps/organizations/tests,apps/projects/tests,apps/usage/tests,apps/webhooks/tests -ll
